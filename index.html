<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List of Chinese Organizations</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

</head>

<body>

  <h1>Chinese Organizations in Honolulu</h1>

  <!-- TIMELINE AT TOP -->
  <section id="timeline">

    <h2>Research Timeline</h2>

    <div class="timeline-wrapper">

      <input type="range" id="yearSlider" min="1850" max="2025" step="1" value="2025">

      <div id="yearDisplay">
        Showing organizations up to: 2025
      </div>

    </div>

  </section>

  <div id="resultsCount"></div>

  <!-- SEARCH + SORT -->
  <div class="controls">

    <div class="search-wrapper">
      <input id="searchInput" type="text" placeholder="Search organizations">
      <button id="clearBtn" aria-label="Clear search">&times;</button>
    </div>

    <select id="nameSort">
      <option value="az">Name A–Z</option>
      <option value="za">Name Z–A</option>
    </select>

    <select id="yearSort">
      <option value="">Year</option>
      <option value="old">Oldest → Newest</option>
      <option value="new">Newest → Oldest</option>
    </select>

  </div>


  <!-- DIRECTORY + MAP -->
  <div class="layout">

    <div id="directory"></div>

    <div id="map"></div>

  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="map.js" defer></script>
  <script src="app.js" defer></script>
  <script src="timeline.js" defer></script>

</body>

</html>
