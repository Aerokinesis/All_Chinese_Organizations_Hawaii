<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List of Chinese Organizations</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

</head>

<body>
  <div class="controls">

    <div class="search-wrapper">
      <input type="text" id="searchInput" placeholder="Search..." class="search-bar" />
      <button id="clearBtn" class="clear-btn">&times;</button>
    </div>

    <select id="nameSort">
      <option value="">Sort Name</option>
      <option value="az">A → Z</option>
      <option value="za">Z → A</option>
    </select>

    <select id="yearSort">
      <option value="">Sort Year</option>
      <option value="old">Oldest → Newest</option>
      <option value="new">Newest → Oldest</option>
    </select>

  </div>
  <p id="resultsCount" class="results-count"></p>

  <div class="layout">

    <div id="directory"></div>

    <div id="map"></div>

  </div>

  <section id="timeline">

<h2>Research Timeline</h2>

<div class="timeline-wrapper">

<input 
type="range"
id="yearSlider"
min="1850"
max="2025"
step="1"
value="2025"
>

<div id="yearDisplay">Showing organizations up to: 2025</div>

</div>

</section>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
  <script src="timeline.js"></script>
</body>

</html>
